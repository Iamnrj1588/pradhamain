version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pradha-db
    environment:
      POSTGRES_DB: pradha_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - pradha-network

  backend:
    build: ./backend-java
    container_name: pradha-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - db
    networks:
      - pradha-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://${SERVER_IP}:${BACKEND_PORT}
        SERVER_IP: ${SERVER_IP}
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: pradha-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - pradha-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pradha-network:
    driver: bridge

