services:
  db:
    image: postgres:15-alpine
    container_name: pradha-db
    environment:
      POSTGRES_DB: pradha_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - pradha-network

  backend:
    build: ./backend-java
    container_name: pradha-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/pradha_db"
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      - db
    networks:
      - pradha-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Use defaults so empty env doesn't produce "http://:" or bad strings
        REACT_APP_BACKEND_URL: "http://${SERVER_IP:-127.0.0.1}:${BACKEND_PORT:-8081}"
        SERVER_IP: "${SERVER_IP:-127.0.0.1}"
        BACKEND_PORT: "${BACKEND_PORT:-8081}"
    container_name: pradha-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - pradha-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pradha-network:
    driver: bridge

