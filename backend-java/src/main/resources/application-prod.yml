spring:
  datasource:
    url: jdbc:postgresql://${SERVER_IP:localhost}:${DB_PORT:5432}/pradha_db
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Niraj@1588}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:pradhafashionoutlet@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:pradha-main}
    base-url: ${S3_BASE_URL:https://pradha-main.s3.eu-north-1.amazonaws.com/}
  region: ${AWS_REGION:eu-north-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}

server:
  port: ${BACKEND_PORT:8081}
  address: 0.0.0.0

logging:
  level:
    com.pradha.main: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"